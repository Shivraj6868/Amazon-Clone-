<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav_logo border">
                <div class="amazon_logo"></div>
            </div>

            <div class="nav_address border">
                <p class="deliver_to">Deliver to</p>
                <div class="nav_location_icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="dilevery_location">India</p>
                </div>
            </div>

            <div class="nav_search_box">
                <select class="select_search">
                    <option>All</option>
                </select>
                <input placeholder="Search Amazon" class="input_search">
                <div class="search_icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="txt_box1 border">
                <p class="txt_sign"><span>Hello, sign in</span></p>
                <p class="txt_account">Account & List</p>
            </div>

            <div class="txt_box2 border">
                <p class="txt_returns"><span>Returns</span></p>
                <p class="txt_orders">& Orders</p>
            </div>

            <div class="nav_Cart_Section border">
                <i class="fa-solid fa-cart-shopping"></i>
                <p class="cart">Cart</p>
            </div>
        </div>
    </header>
</body>
</html>
